<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ludo Royale</title>
<style>
:root{color-scheme:dark;font-family:system-ui;background:#1b1442;color:white}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#3a1c71,#1b1442 70%);min-height:100vh}.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:14px}.hidden{display:none!important}h1{font-size:clamp(32px,8vw,54px);letter-spacing:3px;color:#ffd166;margin:10px}.card{width:min(440px,100%);padding:20px;border:1px solid #ffffff33;border-radius:20px;background:#ffffff12;display:grid;gap:12px;box-shadow:0 20px 50px #0005}input,button{font:inherit;border-radius:12px;padding:12px;border:1px solid #ffffff33}input{background:#100b28;color:white;min-width:0}button{cursor:pointer;font-weight:800;color:white;background:linear-gradient(135deg,#ef476f,#ff9f1c)}button.alt{background:linear-gradient(135deg,#118ab2,#06d6a0)}button:disabled{opacity:.4}.row{display:flex;gap:8px}.row>*{flex:1}.modes{display:flex;gap:6px}.modes button{flex:1;background:#ffffff18}.modes .on{background:#fff;color:#24154f}#err{color:#ff9eaf;text-align:center;min-height:1em}#code{font-size:40px;letter-spacing:8px;color:#ffd166;text-align:center;font-weight:900}.players{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.player{padding:8px 12px;border-radius:12px;background:#ffffff18;border-bottom:4px solid var(--c)}.player.active{outline:2px solid white}#board{width:min(92vw,560px);aspect-ratio:1;border-radius:18px;background:#fdf6e3;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:8px;gap:5px;box-shadow:0 15px 50px #0008}.yard{border-radius:14px;padding:8px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;align-content:center;justify-items:center}.yard b{grid-column:1/-1;color:white}.token{border:0;border-radius:50%;width:38px;height:38px;padding:0;background:white;color:#222;border:4px solid var(--c)}.center{grid-area:2/2;background:conic-gradient(#e63946 0 25%,#2fb344 0 50%,#f5b700 0 75%,#1d6fe0 0);border-radius:12px}.red{background:#e63946}.green{background:#2fb344}.yellow{background:#f5b700}.blue{background:#1d6fe0}.dock{display:flex;align-items:center;gap:14px}.dice{font-size:56px;background:#fff;color:#222;border-radius:14px;width:82px;height:82px;display:grid;place-items:center;box-shadow:0 6px 18px #0006;cursor:pointer}.status{font-weight:800;text-align:center;min-height:28px}#chat{width:min(92vw,560px);background:#ffffff15;border-radius:14px;padding:10px}#msgs{height:80px;overflow:auto;font-size:13px}small{opacity:.8}
</style></head><body>
<section id="lobby" class="screen"><h1>🎲 LUDO ROYALE</h1><div class="card"><input id="name" maxlength="14" placeholder="Your name"><div class="modes" id="modes"><button data-m="2">2 Players</button><button data-m="3">3 Players</button><button data-m="4" class="on">4 Players</button></div><button id="create">Create private room</button><button class="alt" id="bots">Play vs bots</button><div class="row"><input id="joinCode" maxlength="5" placeholder="ROOM CODE"><button id="join">Join room</button></div><div id="err"></div></div></section>
<section id="wait" class="screen hidden"><h1>Waiting Room</h1><div class="card"><div id="code"></div><button class="alt" id="copy">Copy invite link</button><div id="waiting"></div><button id="start">Start game (bots fill empty seats)</button><button class="alt" id="leaveWait">Leave room</button></div></section>
<section id="game" class="screen hidden"><h1>🎲 LUDO ROYALE</h1><div id="roomLabel"></div><div class="players" id="players"></div><div id="board"><div class="yard red" id="yard0"><b>RED</b></div><div class="yard green" id="yard1"><b>GREEN</b></div><div class="yard yellow" id="yard2"><b>YELLOW</b></div><div class="yard blue" id="yard3"><b>BLUE</b></div><div class="center"></div></div><div class="dock"><div class="dice" id="dice">🎲</div><div class="status" id="status">Waiting…</div></div><div id="moves" class="row"></div><div id="chat"><div id="msgs"></div><div class="row"><input id="chatInput" maxlength="140" placeholder="Chat with players"><button id="send">Send</button></div></div><button class="alt" id="leaveGame">Leave game</button></section>
<script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=s=>document.querySelector(s),colors=['#e63946','#2fb344','#f5b700','#1d6fe0'],faces=['⚀','⚁','⚂','⚃','⚄','⚅'];let mode=4,me={name:localStorage.ludoName||'',avatar:'🦊'},state=null;
$('#name').value=me.name;$('#modes').onclick=e=>{if(e.target.dataset.m){mode=+e.target.dataset.m;document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',+b.dataset.m===mode))}};
function profile(){me.name=$('#name').value.trim()||'Player';localStorage.ludoName=me.name;return {...me,mode}};
function show(id){['lobby','wait','game'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}
function err(t){$('#err').textContent=t||''}
$('#create').onclick=()=>{err('');socket.emit('create',profile(),r=>{if(r?.ok)$('#code').textContent=r.code;else err(r?.err||'Could not create room')})};
$('#bots').onclick=()=>{mode=4;socket.emit('create',profile(),r=>{if(r?.ok)socket.emit('start')})};
$('#join').onclick=()=>socket.emit('join',{...profile(),code:$('#joinCode').value},r=>{if(!r?.ok)err(r?.err||'Could not join')});
$('#copy').onclick=async()=>{const u=location.origin+'/?room='+state.code;try{await navigator.clipboard.writeText(u);$('#copy').textContent='Copied!'}catch{$('#copy').textContent=u}};
$('#start').onclick=()=>socket.emit('start');
function leave(){socket.emit('leave');state=null;show('lobby')}
$('#leaveWait').onclick=$('#leaveGame').onclick=leave;
socket.on('state',s=>{state=s;if(!s.started){show('wait');$('#code').textContent=s.code;$('#waiting').innerHTML=s.players.map(p=>'<div class="player" style="--c:'+colors[p.color]+'">'+p.avatar+' '+p.name+(p.bot?' 🤖':'')+'</div>').join('');$('#start').style.display=s.host===socket.id?'':'none';return}show('game');render()});
function render(){if(!state)return;$('#roomLabel').textContent='Room '+state.code+' · '+state.mode+' players';$('#players').innerHTML=state.players.map((p,i)=>'<div class="player '+(i===state.turn?'active':'')+'" style="--c:'+colors[p.color]+'">'+p.avatar+' '+p.name+(p.id===socket.id?' (you)':'')+'</div>').join('');for(let c=0;c<4;c++){const y=$('#yard'+c);y.innerHTML='<b>'+['RED','GREEN','YELLOW','BLUE'][c]+'</b>';const vals=state.tokens[c]||[-1,-1,-1,-1];vals.forEach((v,i)=>{const b=document.createElement('button');b.className='token';b.style.setProperty('--c',colors[c]);b.textContent=v===56?'★':v<0?'•':v;b.title='Token '+(i+1);b.onclick=()=>socket.emit('move',i);y.append(b)})}const p=state.players[state.turn],mine=p?.id===socket.id;$('#status').textContent=state.msg||(state.phase==='over'?'Game over — '+state.players.find(p=>p.color===state.winner)?.name+' wins!':mine?(state.phase==='roll'?'Your turn — roll the dice':'Choose a highlighted token'):(p?.name+' is playing…'));$('#dice').textContent=faces[(state.dice||1)-1];$('#dice').style.opacity=mine&&state.phase==='roll'?1:.55;$('#dice').onclick=()=>{if(mine&&state.phase==='roll')socket.emit('roll')};$('#moves').innerHTML='';if(mine&&state.phase==='move'&&state.legal)state.legal.forEach(i=>{const b=document.createElement('button');b.textContent='Move token '+(i+1);b.onclick=()=>socket.emit('move',i);$('#moves').append(b)});if(state.phase==='over'&&state.host===socket.id){const b=document.createElement('button');b.textContent='Rematch';b.onclick=()=>socket.emit('rematch');$('#moves').append(b)}}
$('#send').onclick=()=>{const v=$('#chatInput').value.trim();if(v){socket.emit('chat',v);$('#chatInput').value=''}};$('#chatInput').onkeydown=e=>{if(e.key==='Enter')$('#send').click()};socket.on('chat',m=>{const d=document.createElement('div');d.textContent=m.avatar+' '+m.name+': '+m.text;$('#msgs').append(d);$('#msgs').scrollTop=1e9});socket.on('connect_error',()=>err('Connection error. Is the game server running?'));const room=new URLSearchParams(location.search).get('room');if(room)$('#joinCode').value=room.toUpperCase();
</script></body></html>
